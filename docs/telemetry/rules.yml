# Recording rules for on-mcp.
#
# Heap headroom lives here rather than as a custom gauge in the server: `@opentelemetry/host-metrics`
# already exports V8 heap used and the heap size limit (the limit reflects
# `--max-old-space-size=28784`), so a bespoke instrument would only duplicate them.

groups:
  - name: on-mcp-runtime
    interval: 30s
    rules:
      # `v8js.memory.heap.*` comes from @opentelemetry/instrumentation-runtime-node. The `limit`
      # series reflects `--max-old-space-size=28784` (~28 GB) from the `start` script.
      - record: ocean_mcp:heap_used_ratio
        expr: |
          sum(v8js_memory_heap_space_used_size_by_space_bytes)
            / clamp_min(sum(v8js_memory_heap_space_available_size_by_space_bytes)
                        + sum(v8js_memory_heap_space_used_size_by_space_bytes), 1)

  - name: on-mcp-usage
    interval: 30s
    rules:
      # Fraction of service starts that were ever observed reaching Running. The gap is the
      # silent async-failure rate: a doomed serviceStart still returns a serviceId and then dies
      # in the background at the Locking step, so this is the only place it is visible.
      - record: ocean_mcp:service_start_success_rate
        expr: |
          sum(rate(mcp_service_observed_total{service_status="running"}[30m]))
            / clamp_min(sum(rate(mcp_service_started_total[30m])), 0.0001)

      # Escrow blockage seen from inside computeStart / serviceStart — the actionable one, since
      # the user hit it without asking for a check.
      - record: ocean_mcp:escrow_gate_block_rate
        expr: |
          sum(rate(mcp_escrow_preflight_total{caller=~".*_gate", result!="ready"}[30m]))
            / clamp_min(sum(rate(mcp_escrow_preflight_total{caller=~".*_gate"}[30m])), 0.0001)

      # Dataset ordering. `order_asset` is a multi-step state machine, so this is the share of
      # started order flows that reached `complete` rather than stalling after a signature.
      - record: ocean_mcp:asset_order_completion_rate
        expr: |
          sum(rate(mcp_asset_order_total{status="complete"}[30m]))
            / clamp_min(sum(rate(mcp_asset_order_total{status="needs_broadcast"}[30m])), 0.0001)

      # DDO resolution is the precondition for ordering, compute and download alike — a falling
      # rate here leads the failures in all three.
      - record: ocean_mcp:ddo_resolve_hit_rate
        expr: |
          sum(rate(mcp_ddo_resolve_total{found="true"}[30m]))
            / clamp_min(sum(rate(mcp_ddo_resolve_total[30m])), 0.0001)

      # Share of tool errors that are authentication failures. Distinguishes "tokens are broken"
      # from "infrastructure is broken", which have completely different fixes.
      - record: ocean_mcp:auth_error_share
        expr: |
          sum(rate(mcp_tool_calls_total{status="error", error_type="auth"}[30m]))
            / clamp_min(sum(rate(mcp_tool_calls_total{status="error"}[30m])), 0.0001)

      # Dead-session pressure: requests rejected before reaching a tool, relative to real traffic.
      # Spikes after a deploy as clients retry session ids that died with the old process.
      - record: ocean_mcp:transport_rejection_rate
        expr: |
          sum(rate(mcp_transport_rejected_total[30m]))
            / clamp_min(sum(rate(mcp_transport_rejected_total[30m]))
                        + sum(rate(mcp_tool_calls_total[30m])), 0.0001)
