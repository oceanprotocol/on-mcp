# Minimal Prometheus config for the local telemetry stack.
#
# on-mcp metrics arrive by remote-write from the OTel Collector, not by scraping — the server
# exposes no /metrics endpoint. The scrape job below only watches Prometheus itself, which is
# useful when debugging whether remote-write is landing at all.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

rule_files:
  - /etc/prometheus/rules.yml
